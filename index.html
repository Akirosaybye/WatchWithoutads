<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchWithoutads</title>
  <style>
    /* RESET Y ESTILOS BASE MONOCROMÁTICOS (B&W) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    /* ENCABEZADO */
    header {
      width: 100%;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #000000;
      border-bottom: 1px solid #333333;
      z-index: 10;
    }
    .brand {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .device-badge {
      font-size: 0.85rem;
      background: #1a1a1a;
      border: 1px solid #444444;
      padding: 4px 10px;
      border-radius: 4px;
      color: #cccccc;
    }

    /* PANEL DE SELECCIÓN DE SERIES Y EPISODIOS */
    .selector-container {
      width: 100%;
      max-width: 900px;
      padding: 15px 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      background: #080808;
      border-bottom: 1px solid #222222;
    }
    .dropdown-group {
      position: relative;
      display: inline-block;
    }
    .btn-dropdown {
      background: #111111;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-dropdown:hover, .btn-dropdown:focus {
      background: #222222;
      border-color: #ffffff;
      outline: none;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 105%;
      left: 0;
      background: #111111;
      border: 1px solid #444444;
      border-radius: 6px;
      min-width: 220px;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      z-index: 100;
    }
    .dropdown-menu.show {
      display: block;
    }
    .dropdown-item {
      padding: 10px 15px;
      color: #dddddd;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #222222;
      transition: background 0.15s, color 0.15s;
    }
    .dropdown-item:last-child {
      border-bottom: none;
    }
    .dropdown-item:hover {
      background: #ffffff;
      color: #000000;
    }

    /* CONTENEDOR DEL REPRODUCTOR */
    .player-wrapper {
      width: 100%;
      max-width: 950px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #222222;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000000;
      display: block;
    }

    /* BOTÓN DE PLAY EN EL CENTRO ESTILO JK ANIME (BLANCO/NEGRO) */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      z-index: 5;
      transition: transform 0.2s, opacity 0.3s;
      pointer-events: auto;
    }
    .center-play-btn:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background-color: #eeeeee;
    }
    .play-icon-shape {
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #000000;
      margin-left: 5px;
    }

    /* BARRA DE CONTROLES INFERIOR */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
      padding: 15px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 6;
      transition: opacity 0.3s ease;
      opacity: 1;
    }
    .controls-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* BARRA DE PROGRESO DE VIDEO INTERACTIVA */
    .progress-bar-wrapper {
      width: 100%;
      height: 10px;
      background: #333333;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 5px;
      transition: width 0.1s linear;
    }

    /* CONTROLES ABAJO */
    .bottom-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .mini-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-btn:hover {
      opacity: 0.8;
    }
    .time-display {
      font-size: 0.85rem;
      font-family: monospace;
      color: #cccccc;
    }
    .status-info {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #777777;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="brand">WatchWithoutads</div>
    <div class="device-badge" id="deviceBadge">Detectando dispositivo...</div>
  </header>

  <!-- SELECTOR DE SERIES Y EPISODIOS -->
  <div class="selector-container">
    <div class="dropdown-group">
      <button class="btn-dropdown" id="btnSeries">
        <span id="labelSerie">Cargando series...</span> ▼
      </button>
      <div class="dropdown-menu" id="menuSeries"></div>
    </div>

    <div class="dropdown-group">
      <button class="btn-dropdown" id="btnEpisodes">
        <span id="labelEpisode">Selecciona episodios...</span> ▼
      </button>
      <div class="dropdown-menu" id="menuEpisodes"></div>
    </div>
  </div>

  <!-- REPRODUCTOR MP4 -->
  <div class="player-wrapper">
    <div class="video-box" id="videoBox">
      <video id="mainVideo" preload="metadata" playsinline></video>

      <!-- Botón Central Blanco/Negro (Estilo JK Anime) -->
      <div class="center-play-btn" id="centerPlayBtn">
        <div class="play-icon-shape" id="centerIcon"></div>
      </div>

      <!-- Controles -->
      <div class="controls-overlay" id="controlsOverlay">
        <div class="progress-bar-wrapper" id="progressWrapper">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="bottom-controls-row">
          <div class="left-controls">
            <button class="mini-btn" id="miniPlayBtn">▶</button>
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
          </div>
          <div class="right-controls">
            <button class="mini-btn" id="fullscreenBtn" title="Pantalla Completa">⛶</button>
          </div>
        </div>
      </div>
    </div>
    <div class="status-info" id="statusInfo">Escaneando repositorio...</div>
  </div>

  <script>
    const GITHUB_USER = "Akirosaybye";
    const GITHUB_REPO = "WatchWithoutads";

    let catalog = [];
    let currentSerieIndex = 0;
    let currentEpisodeIndex = 0;
    let hideTimer = null;

    const video = document.getElementById('mainVideo');
    const videoBox = document.getElementById('videoBox');
    const centerPlayBtn = document.getElementById('centerPlayBtn');
    const miniPlayBtn = document.getElementById('miniPlayBtn');
    const controlsOverlay = document.getElementById('controlsOverlay');
    const progressWrapper = document.getElementById('progressWrapper');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const deviceBadge = document.getElementById('deviceBadge');
    const statusInfo = document.getElementById('statusInfo');

    const btnSeries = document.getElementById('btnSeries');
    const menuSeries = document.getElementById('menuSeries');
    const labelSerie = document.getElementById('labelSerie');

    const btnEpisodes = document.getElementById('btnEpisodes');
    const menuEpisodes = document.getElementById('menuEpisodes');
    const labelEpisode = document.getElementById('labelEpisode');

    function detectDevice() {
      try {
        const ua = navigator.userAgent.toLowerCase();
        if (/smart-tv|smarttv|googletv|appletv|hbbtv|pov_tv|netcast|webos/.test(ua)) return "Smart TV";
        if (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/.test(ua)) return "Móvil / Tablet";
        return "PC / Laptop";
      } catch (e) {
        return "PC / Laptop";
      }
    }

    async function fetchGitHubCatalog() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`);
        if (!response.ok) throw new Error("Error API GitHub");
        const rootItems = await response.json();

        const folders = rootItems.filter(item => item.type === "dir");
        let loadedCatalog = [];

        for (const folder of folders) {
          const folderRes = await fetch(folder.url);
          if (folderRes.ok) {
            const files = await folderRes.json();
            const mp4Files = files.filter(f => f.name.toLowerCase().endsWith('.mp4'));
            
            if (mp4Files.length > 0) {
              loadedCatalog.push({
                name: folder.name,
                episodes: mp4Files.map(file => ({
                  title: file.name,
                  // URL principal desde API y fallback a la ruta local
                  url: file.download_url || `./${encodeURIComponent(folder.name)}/${encodeURIComponent(file.name)}`,
                  fallbackUrl: `./${folder.name}/${file.name}`
                }))
              });
            }
          }
        }

        if (loadedCatalog.length > 0) {
          catalog = loadedCatalog;
          statusInfo.innerText = "Catálogo cargado correctamente desde GitHub.";
        } else {
          useFallbackCatalog("No se hallaron carpetas con archivos .mp4.");
        }
      } catch (err) {
        useFallbackCatalog("Usando catálogo de respaldo.");
      }
      renderDropdowns();
      loadCurrentEpisode();
    }

    function useFallbackCatalog(msg) {
      statusInfo.innerText = msg;
      catalog = [
        {
          name: "clannad",
          episodes: [
            {
              title: "clannadt2c5.mp4",
              url: "./clannad/clannadt2c5.mp4",
              fallbackUrl: "./clannad/clannadt2c5.mp4"
            }
          ]
        }
      ];
    }

    function renderDropdowns() {
      if (!catalog.length) return;

      menuSeries.innerHTML = "";
      catalog.forEach((serie, idx) => {
        const item = document.createElement('div');
        item.className = "dropdown-item";
        item.innerText = serie.name;
        item.onclick = (e) => {
          e.stopPropagation();
          currentSerieIndex = idx;
          currentEpisodeIndex = 0;
          menuSeries.classList.remove('show');
          renderDropdowns();
          loadCurrentEpisode();
        };
        menuSeries.appendChild(item);
      });

      labelSerie.innerText = catalog[currentSerieIndex].name;

      menuEpisodes.innerHTML = "";
      const episodes = catalog[currentSerieIndex].episodes;
      episodes.forEach((ep, idx) => {
        const item = document.createElement('div');
        item.className = "dropdown-item";
        item.innerText = ep.title;
        item.onclick = (e) => {
          e.stopPropagation();
          currentEpisodeIndex = idx;
          menuEpisodes.classList.remove('show');
          renderDropdowns();
          loadCurrentEpisode();
        };
        menuEpisodes.appendChild(item);
      });

      labelEpisode.innerText = episodes[currentEpisodeIndex] ? episodes[currentEpisodeIndex].title : "Sin episodios";
    }

    function loadCurrentEpisode() {
      const ep = catalog[currentSerieIndex]?.episodes[currentEpisodeIndex];
      if (ep) {
        video.src = ep.url;
        video.onerror = () => {
          // Si la primera URL falla, intenta la ruta fallback
          if (video.src !== ep.fallbackUrl) {
            video.src = ep.fallbackUrl;
            video.load();
          }
        };
        video.load();
        updatePlayStateUI(false);
      }
    }

    function togglePlay() {
      if (video.paused) {
        video.play().catch(() => {});
        updatePlayStateUI(true);
      } else {
        video.pause();
        updatePlayStateUI(false);
      }
    }

    function updatePlayStateUI(isPlaying) {
      if (isPlaying) {
        centerPlayBtn.style.opacity = '0';
        centerPlayBtn.style.pointerEvents = 'none';
        miniPlayBtn.innerText = '❚❚';
      } else {
        centerPlayBtn.style.opacity = '1';
        centerPlayBtn.style.pointerEvents = 'auto';
        miniPlayBtn.innerText = '▶';
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const pM = String(m).padStart(2, '0');
      const pS = String(s).padStart(2, '0');
      return h > 0 ? `${h}:${pM}:${pS}` : `${pM}:${pS}`;
    }

    video.ontimeupdate = () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressFill.style.width = `${pct}%`;
        timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    };

    video.onloadedmetadata = () => {
      timeDisplay.innerText = `00:00 / ${formatTime(video.duration)}`;
    };

    progressWrapper.onclick = (e) => {
      e.stopPropagation();
      const rect = progressWrapper.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (video.duration) {
        video.currentTime = pos * video.duration;
      }
    };

    function resetControlsTimer() {
      controlsOverlay.classList.remove('hidden');
      if (video.paused) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        controlsOverlay.classList.add('hidden');
      }, 3000);
    }

    videoBox.addEventListener('mousemove', resetControlsTimer);
    videoBox.addEventListener('touchstart', resetControlsTimer);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        videoBox.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009) {
        if (document.fullscreenElement) {
          e.preventDefault();
          document.exitFullscreen();
        }
      }
      if (e.key === ' ' || e.key === 'MediaPlayPause') {
        e.preventDefault();
        togglePlay();
      }
    });

    centerPlayBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    miniPlayBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    fullscreenBtn.onclick = (e) => { e.stopPropagation(); toggleFullscreen(); };
    video.onclick = () => togglePlay();

    btnSeries.onclick = (e) => {
      e.stopPropagation();
      menuEpisodes.classList.remove('show');
      menuSeries.classList.toggle('show');
    };
    btnEpisodes.onclick = (e) => {
      e.stopPropagation();
      menuSeries.classList.remove('show');
      menuEpisodes.classList.toggle('show');
    };
    document.onclick = () => {
      menuSeries.classList.remove('show');
      menuEpisodes.classList.remove('show');
    };

    window.onload = () => {
      deviceBadge.innerText = `Dispositivo: ${detectDevice()}`;
      fetchGitHubCatalog();
      resetControlsTimer();
    };
  </script>
</body>
</html>
