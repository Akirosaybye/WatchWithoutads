<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor MP4 - Alto Contraste</title>
    <style>
        /* ESTILOS DE ALTO CONTRASTE (CSS PURO SIN DEPENDENCIAS EXTERNAS) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Encabezado y Selectores */
        header {
            width: 100%;
            padding: 15px 25px;
            background-color: #050505;
            border-bottom: 1px solid #222222;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-left: 4px solid #ffffff;
            padding-left: 10px;
        }

        .select-wrapper {
            position: relative;
            display: inline-block;
        }

        .custom-button {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .custom-button:hover, .custom-button:focus {
            border-color: #ffffff;
            background-color: #1c1c1c;
            outline: none;
        }

        .custom-button svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 6px;
            min-width: 240px;
            max-height: 280px;
            overflow-y: auto;
            background-color: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 200;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #aaaaaa;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .dropdown-item:hover {
            background-color: #222222;
            color: #ffffff;
        }

        .dropdown-item.selected {
            color: #ffffff;
            font-weight: bold;
            background-color: #1a1a1a;
        }

        .device-badge {
            font-family: monospace;
            font-size: 0.75rem;
            background-color: #111111;
            border: 1px solid #222222;
            padding: 6px 12px;
            border-radius: 20px;
            color: #cccccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        /* Contenedor Principal del Reproductor */
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border: 1px solid #222222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
        }

        /* Botón Central Estilo JK Anime (Blanco y Negro) */
        .center-play-btn {
            position: absolute;
            z-index: 30;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            transition: opacity 0.3s ease, transform 0.2s ease;
            opacity: 0;
            pointer-events: none;
        }

        .center-play-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .center-play-btn:hover {
            transform: scale(1.08);
        }

        .center-play-btn svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
            margin-left: 3px;
        }

        /* Controles Inferiores */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.4), transparent);
            padding: 15px 20px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 40;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .controls-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Barra de Progreso Interactivas */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            height: 100%;
            background-color: #ffffff;
            border-radius: 4px;
            width: 0%;
            position: relative;
        }

        .progress-thumb {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* Botones e información de tiempo */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 0.7;
        }

        .icon-btn svg {
            width: 24px;
        <header class="flex items-center justify-between border-b border-zinc-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded bg-white text-black font-extrabold flex items-center justify-center text-xl tracking-tighter">
                    W
                </div>
                <div>
                    <!-- Updated header title -->
                    <h1 class="text-xl font-bold tracking-tight text-white">WatchWithoutads</h1>
                    <p class="text-xs text-zinc-400">Reproductor Minimalista en Blanco y Negro</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 text-xs text-zinc-300">
                <i class="fas fa-tv text-zinc-400" id="device-icon"></i>
                <span id="device-type-label">Detectando dispositivo...</span>
            </div>
        </header>

        <!-- Selector Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Series Selector -->
            <div class="relative">
                <label class="block text-xs font-medium text-zinc-400 mb-1 tracking-wider uppercase">Serie</label>
                <div id="series-select-btn" tabindex="0" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3.5 flex items-center justify-between cursor-pointer hover:border-zinc-700 transition focus:outline-none focus:border-white">
                    <span id="series-selected-text" class="text-sm font-medium truncate">Cargando series desde GitHub...</span>
                    <i class="fas font-thin fa-chevron-down text-xs text-zinc-400"></i>
                </div>
                <div id="series-dropdown" class="custom-dropdown absolute left-0 right-0 top-full mt-2 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 p-1.5 hidden max-h-60 overflow-y-auto">
                    <!-- Dynamic Series Options from GitHub API -->
                </div>
            </div>

            <!-- Episode Selector -->
            <div class="relative">
                <label class="block text-xs font-medium text-zinc-400 mb-1 tracking-wider uppercase">Capítulo</label>
                <div id="episode-select-btn" tabindex="0" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3.5 flex items-center justify-between cursor-pointer hover:border-zinc-700 transition focus:outline-none focus:border-white">
                    <span id="episode-selected-text" class="text-sm font-medium truncate">Selecciona una serie primero</span>
                    <i class="fas font-thin fa-chevron-down text-xs text-zinc-400"></i>
                </div>
                <div id="episode-dropdown" class="custom-dropdown absolute left-0 right-0 top-full mt-2 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 p-1.5 hidden max-h-60 overflow-y-auto">
                    <!-- Dynamic Episode Options from GitHub API -->
                </div>
            </div>
        </div>

        <div class="device-badge">
            <div class="badge-dot"></div>
            Dispositivo: <span id="deviceIndicator">Detectando...</span>
        </div>
    </header>

    <!-- Área del Reproductor Central -->
    <main>
        <div id="playerContainer" class="player-container">
            
            <!-- Elemento de Video MP4 -->
            <video id="mainVideo" playsinline></video>

            <!-- Botón de Reproducción Central (Blanco y Negro) -->
            <button id="centerPlayBtn" class="center-play-btn" aria-label="Reproducir o Pausar">
                <svg id="centerPlayIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>

            <!-- Overlay de Controles Inferiores -->
            <div id="controlsOverlay" class="controls-overlay">
                <!-- Seeker / Barra de Progreso -->
                <div id="progressContainer" class="progress-container">
                    <div id="progressBar" class="progress-bar">
                        <div class="progress-thumb"></div>
                    </div>
                </div>

                <!-- Botones y Tiempo -->
                <div class="controls-row">
                    <div class="controls-left">
                        <button id="bottomPlayBtn" class="icon-btn" aria-label="Play/Pausa">
                            <svg id="bottomPlayIcon" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </button>
                        <div id="timeDisplay" class="time-text">0:00 / 0:00</div>
                    </div>

                    <div class="controls-right">
                        <button id="fullscreenBtn" class="icon-btn" aria-label="Pantalla Completa">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer>
        Reproductor MP4 de Alto Contraste para GitHub Pages — Detección Automática de Contenido
    </footer>

    <script>
        // State Management
        const state = {
            catalog: [], // Dynamically populated from GitHub API
            currentSeriesIndex: 0,
            currentEpisodeIndex: 0,
            controlsTimeout: null,
            isControlsVisible: true,
            isSeeking: false,
            deviceType: 'PC/Laptop'
        };

        // GitHub Repository Config
        const GITHUB_REPO_OWNER = 'Akirosaybye';
        const GITHUB_REPO_NAME = 'WatchWithoutads';
        const GITHUB_API_BASE = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents`;

        // DOM Elements
        const playerContainer = document.getElementById('player-container');
        const videoElement = document.getElementById('video-player');
        const overlayPlayBtn = document.getElementById('overlay-play-btn');
        const customControls = document.getElementById('custom-controls');
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevEpBtn = document.getElementById('prev-ep');
        const nextEpBtn = document.getElementById('next-ep');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        const progressBar = document.getElementById('progress-bar');
        const progressFilled = document.getElementById('progress-filled');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        
        const seriesSelectBtn = document.getElementById('series-select-btn');
        const seriesSelectedText = document.getElementById('series-selected-text');
        const seriesDropdown = document.getElementById('series-dropdown');
        
        const episodeSelectBtn = document.getElementById('episode-select-btn');
        const episodeSelectedText = document.getElementById('episode-selected-text');
        const episodeDropdown = document.getElementById('episode-dropdown');

        const deviceIcon = document.getElementById('device-icon');
        const deviceTypeLabel = document.getElementById('device-type-label');

        // Fetch dynamic series and episode files from GitHub API
        async function fetchGitHubCatalog() {
            seriesSelectedText.textContent = 'Buscando series en GitHub...';
            episodeSelectedText.textContent = 'Esperando serie...';
            
            try {
                const response = await fetch(GITHUB_API_BASE);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const items = await response.json();
                
                // Filter folders/directories as Series
                const folders = items.filter(item => item.type === 'dir');
                
                if (folders.length === 0) {
                    seriesSelectedText.textContent = 'No se encontraron carpetas';
                    return;
                }

                // Process folders into series catalog entries
                state.catalog = folders.map(folder => ({
                    title: folder.name,
                    path: folder.path,
                    episodes: [],
                    isLoaded: false
                }));

                renderSeriesDropdown();

                // Select first series by default
                await selectSeries(0);

            } catch (error) {
                console.error('Error fetching catalog from GitHub:', error);
                seriesSelectedText.textContent = 'Error al cargar catálogo';
                episodeSelectedText.textContent = 'Verifica conexión o repositiorio';
            }
        }

        // Fetch episodes for a specific series folder
        async function fetchEpisodesForSeries(seriesIndex) {
            const series = state.catalog[seriesIndex];
            if (!series) return;

            if (series.isLoaded) return; // Cached

            episodeSelectedText.textContent = 'Cargando capítulos...';
            episodeDropdown.innerHTML = `<div class="p-3 text-center text-xs text-zinc-500">Buscando archivos .mp4...</div>`;

            try {
                const url = `${GITHUB_API_BASE}/${encodeURIComponent(series.path)}`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const items = await response.json();

                // Filter .mp4 files
                const mp4Files = items.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp4'));

                series.episodes = mp4Files.map(file => {
                    // Prettify title (remove .mp4 extension)
                    const cleanTitle = file.name.replace(/\.mp4$/i, '');
                    return {
                        title: cleanTitle,
                        url: file.download_url || `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/main/${encodeURIComponent(series.path)}/${encodeURIComponent(file.name)}`
                    };
                });

                series.isLoaded = true;
            } catch (error) {
                console.error(`Error fetching episodes for ${series.title}:`, error);
                series.episodes = [];
                series.isLoaded = true;
            }
        }

        async function selectSeries(index) {
            if (!state.catalog[index]) return;

            state.currentSeriesIndex = index;
            state.currentEpisodeIndex = 0;
            const series = state.catalog[index];

            seriesSelectedText.textContent = series.title;

            // Render updated series checkmark
            renderSeriesDropdown();

            // Load episodes dynamically
            await fetchEpisodesForSeries(index);

            // Render Episode dropdown list
            renderEpisodeDropdown();

            if (series.episodes.length > 0) {
                loadEpisode(0);
            } else {
                episodeSelectedText.textContent = 'Sin episodios (.mp4)';
                videoElement.src = '';
                currentTimeEl.textContent = '00:00';
                durationEl.textContent = '00:00';
            }
        }

        function loadEpisode(epIndex) {
            const series = state.catalog[state.currentSeriesIndex];
            if (!series || !series.episodes || series.episodes.length === 0) return;

            if (epIndex < 0 || epIndex >= series.episodes.length) return;

            state.currentEpisodeIndex = epIndex;
            const episode = series.episodes[epIndex];

            episodeSelectedText.textContent = episode.title;
            renderEpisodeDropdown();

            videoElement.src = episode.url;
            videoElement.load();
            
            // Auto play attempt
            videoElement.play().then(() => {
                updatePlayStateUI(true);
            }).catch(() => {
                updatePlayStateUI(false);
            });

            updateNavButtonsState();
        }

        // Render Series Dropdown
        function renderSeriesDropdown() {
            seriesDropdown.innerHTML = '';
            state.catalog.forEach((series, idx) => {
                const item = document.createElement('div');
                item.tabIndex = 0;
                item.className = `dropdown-option flex items-center justify-between p-3 rounded-lg text-sm cursor-pointer transition ${idx === state.currentSeriesIndex ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}`;
                
                item.innerHTML = `
                    <span class="truncate">${series.title}</span>
                    ${idx === state.currentSeriesIndex ? '<i class="fas fa-check text-xs text-white"></i>' : ''}
                `;

                item.addEventListener('click', () => {
                    selectSeries(idx);
                    seriesDropdown.classList.add('hidden');
                });

                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectSeries(idx);
                        seriesDropdown.classList.add('hidden');
                    }
                });

                seriesDropdown.appendChild(item);
            });
        }

        // Render Episode Dropdown
        function renderEpisodeDropdown() {
            episodeDropdown.innerHTML = '';
            const series = state.catalog[state.currentSeriesIndex];

            if (!series || !series.episodes || series.episodes.length === 0) {
                episodeDropdown.innerHTML = `<div class="p-3 text-center text-xs text-zinc-500">No hay archivos .mp4 en esta carpeta</div>`;
                return;
            }

            series.episodes.forEach((ep, idx) => {
                const item = document.createElement('div');
                item.tabIndex = 0;
                item.className = `dropdown-option flex items-center justify-between p-3 rounded-lg text-sm cursor-pointer transition ${idx === state.currentEpisodeIndex ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}`;
                
                item.innerHTML = `
                    <span class="truncate">${ep.title}</span>
                    ${idx === state.currentEpisodeIndex ? '<i class="fas fa-check text-xs text-white"></i>' : ''}
                `;

                item.addEventListener('click', () => {
                    loadEpisode(idx);
                    episodeDropdown.classList.add('hidden');
                });

                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        loadEpisode(idx);
                        episodeDropdown.classList.add('hidden');
                    }
                });

                episodeDropdown.appendChild(item);
            });
        }

        // Device Detection Logic
        function detectDevice() {
            const ua = navigator.userAgent;
            let type = 'PC/Laptop';
            let iconClass = 'fa-desktop';

            if (/TV|SmartTV|HbbTV|NetCast|NETTV|AppleTV|BOX|SmartHub|DLNA|GoogleTV|Chromecast/i.test(ua)) {
                type = 'Smart TV';
                iconClass = 'fa-tv';
            } else if (/Tablet|iPad|PlayBook|Silk/i.test(ua) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /Macintosh/i.test(ua))) {
                type = 'Tablet';
                iconClass = 'fa-tablet-alt';
            } else if (/Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                type = 'Mobile';
                iconClass = 'fa-mobile-alt';
            }

            state.deviceType = type;
            deviceTypeLabel.textContent = type;
            deviceIcon.className = `fas ${iconClass} text-zinc-400`;
        }

        // Custom Dropdown Toggles
        seriesSelectBtn.addEventListener('click', () => {
            seriesDropdown.classList.toggle('hidden');
            episodeDropdown.classList.add('hidden');
        });

        episodeSelectBtn.addEventListener('click', () => {
            episodeDropdown.classList.toggle('hidden');
            seriesDropdown.classList.add('hidden');
        });

        // Close dropdowns on click outside
        document.addEventListener('click', (e) => {
            if (!seriesSelectBtn.contains(e.target) && !seriesDropdown.contains(e.target)) {
                seriesDropdown.classList.add('hidden');
            }
            if (!episodeSelectBtn.contains(e.target) && !episodeDropdown.contains(e.target)) {
                episodeDropdown.classList.add('hidden');
            }
        });

        // Player UI and Interactivity Controls
        function togglePlayPause() {
            if (!videoElement.src) return;

            if (videoElement.paused || videoElement.ended) {
                videoElement.play();
                updatePlayStateUI(true);
            } else {
                videoElement.pause();
                updatePlayStateUI(false);
            }
        }

        function updatePlayStateUI(isPlaying) {
            if (isPlaying) {
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-base"></i>';
                overlayPlayBtn.innerHTML = '<i class="fas fa-pause text-xl text-black ml-0"></i>';
                showControlsTemporarily();
            } else {
                playPauseBtn.innerHTML = '<i class="fas fa-play text-base ml-0.5"></i>';
                overlayPlayBtn.innerHTML = '<i class="fas fa-play text-xl text-black ml-1"></i>';
                showControlsPermanent();
            }
        }

        function showControlsTemporarily() {
            customControls.classList.remove('opacity-0', 'pointer-events-none');
            overlayPlayBtn.classList.remove('opacity-0', 'pointer-events-none');
            state.isControlsVisible = true;

            clearTimeout(state.controlsTimeout);
            if (!videoElement.paused) {
                state.controlsTimeout = setTimeout(() => {
                    customControls.classList.add('opacity-0', 'pointer-events-none');
                    overlayPlayBtn.classList.add('opacity-0', 'pointer-events-none');
                    state.isControlsVisible = false;
                }, 3000);
            }
        }

        function showControlsPermanent() {
            clearTimeout(state.controlsTimeout);
            customControls.classList.remove('opacity-0', 'pointer-events-none');
            overlayPlayBtn.classList.remove('opacity-0', 'pointer-events-none');
            state.isControlsVisible = true;
        }

        // Interaction Listeners for Auto-Hiding Controls
        playerContainer.addEventListener('mousemove', showControlsTemporarily);
        playerContainer.addEventListener('touchstart', showControlsTemporarily, { passive: true });
        playerContainer.addEventListener('click', (e) => {
            if (e.target === videoElement || e.target === playerContainer || e.target.id === 'overlay-play-btn') {
                togglePlayPause();
            } else {
                showControlsTemporarily();
            }
        });

        // Time Format Helper (HH:MM:SS or MM:SS)
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);

            if (h > 0) {
                return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Video Progress and Time Updates
        videoElement.addEventListener('timeupdate', () => {
            if (!state.isSeeking && videoElement.duration) {
                const percentage = (videoElement.currentTime / videoElement.duration) * 100;
                progressFilled.style.width = `${percentage}%`;
                currentTimeEl.textContent = formatTime(videoElement.currentTime);
            }
        });

        videoElement.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(videoElement.duration);
        });

        videoElement.addEventListener('ended', () => {
            updatePlayStateUI(false);
            const series = state.catalog[state.currentSeriesIndex];
            if (series && series.episodes && state.currentEpisodeIndex < series.episodes.length - 1) {
                loadEpisode(state.currentEpisodeIndex + 1);
            }
        });

        // Progress Bar Click and Touch Seeking
        function seek(event) {
            if (!videoElement.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            
            progressFilled.style.width = `${pos * 100}%`;
            videoElement.currentTime = pos * videoElement.duration;
            currentTimeEl.textContent = formatTime(videoElement.currentTime);
        }

        let isDraggingProgress = false;

        progressBar.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            state.isSeeking = true;
            seek(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                seek(e);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                state.isSeeking = false;
            }
        });

        progressBar.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            state.isSeeking = true;
            seek(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                seek(e);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                state.isSeeking = false;
            }
        });

        // Next / Prev Episode Navigation
        function updateNavButtonsState() {
            const series = state.catalog[state.currentSeriesIndex];
            if (!series || !series.episodes || series.episodes.length === 0) {
                prevEpBtn.disabled = true;
                nextEpBtn.disabled = true;
                prevEpBtn.classList.add('opacity-30', 'cursor-not-allowed');
                nextEpBtn.classList.add('opacity-30', 'cursor-not-allowed');
                return;
            }

            const epCount = series.episodes.length;
            
            prevEpBtn.disabled = state.currentEpisodeIndex <= 0;
            prevEpBtn.classList.toggle('opacity-30', state.currentEpisodeIndex <= 0);
            prevEpBtn.classList.toggle('cursor-not-allowed', state.currentEpisodeIndex <= 0);

            nextEpBtn.disabled = state.currentEpisodeIndex >= epCount - 1;
            nextEpBtn.classList.toggle('opacity-30', state.currentEpisodeIndex >= epCount - 1);
            nextEpBtn.classList.toggle('cursor-not-allowed', state.currentEpisodeIndex >= epCount - 1);
        }

        prevEpBtn.addEventListener('click', () => {
            if (state.currentEpisodeIndex > 0) {
                loadEpisode(state.currentEpisodeIndex - 1);
            }
        });

        nextEpBtn.addEventListener('click', () => {
            const series = state.catalog[state.currentSeriesIndex];
            if (series && series.episodes && state.currentEpisodeIndex < series.episodes.length - 1) {
                loadEpisode(state.currentEpisodeIndex + 1);
            }
        });

        // Toggle Fullscreen logic
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerContainer.requestFullscreen) {
                    playerContainer.requestFullscreen();
                } else if (playerContainer.webkitRequestFullscreen) {
                    playerContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        function updateFullscreenIcon() {
            const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fullscreenBtn.innerHTML = isFull 
                ? '<i class="fas fa-compress text-base"></i>' 
                : '<i class="fas fa-expand text-base"></i>';
        }

        // Smart TV and Keyboard Remote Control Handling
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case ' ':
                case 'k':
                case 'MediaPlayPause':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'ArrowRight':
                    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                        e.preventDefault();
                        videoElement.currentTime = Math.min(videoElement.duration, videoElement.currentTime + 5);
                        showControlsTemporarily();
                    }
                    break;
                case 'ArrowLeft':
                    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                        e.preventDefault();
                        videoElement.currentTime = Math.max(0, videoElement.currentTime - 5);
                        showControlsTemporarily();
                    }
                    break;
                case 'f':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 'Back':
                case 'BrowserBack':
                case 'Escape':
                    // If in fullscreen, escape fullscreen naturally or catch custom back button
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        e.preventDefault();
                        toggleFullscreen();
                    }
                    break;
            }
        });

        // Initialize on Window Load
        window.onload = function() {
            detectDevice();
            fetchGitHubCatalog();
        };
    </script>
</body>
</html>
